# /app/nginx/django_app.conf
# Server block configuration for the Django application

server {
    listen 80;
    # Replace YOUR_VM_IP_OR_DOMAIN with your server's public IP address or domain name
    # For local testing on the VM, you can use 'localhost' or the VM's local IP.
    server_name YOUR_VM_IP_OR_DOMAIN;

    # Replace /path/to/your/project_root with the actual absolute path
    # to the root directory of your cloned project on your VM.
    # Example: /home/your_user/my_django_project
    set $project_root /path/to/your/project_root;

    access_log /var/log/nginx/django_app_access.log;
    error_log /var/log/nginx/django_app_error.log;

    location /static/ {
        alias $project_root/staticfiles/; # Path to your collected static files
        expires 30d;
        add_header Cache-Control "public";
    }

    # Optional: Location for media files (if you add them to your Django project)
    # location /media/ {
    #     alias $project_root/media/;
    # }

    location / {
        proxy_pass http://127.0.0.1:8000; # Gunicorn should be running on this address/port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s; # Optional: Increase timeout for long-running requests
        proxy_connect_timeout 75s; # Optional: Increase timeout for Gunicorn connection
    }
}
